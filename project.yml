name: CareTap
options:
  minimumXcodeGenVersion: 2.39.1
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: 1
    # Do NOT set DEVELOPMENT_ASSET_PATHS to CareTap/Resources — Xcode omits those assets from
    # Release/App Store builds (no Assets.car, no icons). Use a dedicated Preview-only folder if needed.
    DEVELOPMENT_TEAM: R662BH835Y
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    AD_HOC_CODE_SIGNING_ALLOWED: YES
    # Allow post-build PlistBuddy to patch the bundled Info.plist (Xcode user script sandbox).
    ENABLE_USER_SCRIPT_SANDBOXING: NO
schemes:
  CareTap:
    build:
      targets:
        CareTap: all
        CareTapWidgetExtension: [build]
        CareTapTests: [test]
    run:
      config: Debug
      storeKitConfiguration: CareTap/Resources/StoreKit/CareTapPremium.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: CareTapTests
    analyze:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
targets:
  CareTap:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    info:
      path: CareTap/Info.plist
      properties:
        CFBundleDisplayName: TapCare
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.maxnguyen.caretap
            CFBundleURLSchemes:
              - caretap
        UILaunchStoryboardName: LaunchScreen
        CareTapSupabaseProjectURL: https://qznwkvezqsxcbbvgqjci.supabase.co
        CareTapSupabasePublishableKey: sb_publishable_z3lkN1DweATyHJxZNAmluA_6jnesRfG
        CareTapUniversalLinkHost: vercel-links-mu.vercel.app
        CareTapTapKitCheckoutURL: ""
        CareTapTapKitStarterPaymentLink: "https://buy.stripe.com/28E3cvelbbTN6Ad8riao800"
        CareTapTapKitFamilyPaymentLink: "https://buy.stripe.com/eVqfZh3GxcXR1fTcHyao801"
        CareTapStripePublishableKey: ""
        CareTapPremiumMonthlyProductID: com.maxnguyen.caretap.premium.monthly
        CareTapPremiumYearlyProductID: com.maxnguyen.caretap.premium.yearly
        CareTapAppGroupIdentifier: group.com.maxnguyen.caretap.shared
        NFCReaderUsageDescription: TapCare uses NFC tags on bottles and organizers so you can confirm daily routines with a simple tap.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconName: AppIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
    sources:
      - path: CareTap/Sources/App
      - path: CareTap/Sources/DesignSystem
      - path: CareTap/Sources/Features
      - path: CareTap/Sources/Models
      - path: CareTap/Sources/Services
      - path: CareTap/Sources/Infrastructure
      - path: CareTap/Sources/Previews
      - path: CareTap/Resources
        buildPhase: resources
        excludes:
          - StoreKit/**
    postBuildScripts:
      - name: Ad Hoc Sign Embedded Widget For Simulator
        basedOnDependencyAnalysis: false
        script: |
          if [ "${PLATFORM_NAME}" = "iphonesimulator" ]; then
            WIDGET_PATH="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/PlugIns/CareTapWidget.appex"
            if [ -d "${WIDGET_PATH}" ]; then
              /usr/bin/codesign --force --sign - --timestamp=none --generate-entitlement-der "${WIDGET_PATH}"
            fi
          fi
      - name: Ensure CFBundleIconName and compiled asset catalog
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          APP_DIR="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          PLIST="${APP_DIR}/Info.plist"
          CAR="${APP_DIR}/Assets.car"
          if [[ ! -d "$APP_DIR" ]]; then
            echo "warning: app bundle not found at ${APP_DIR}"
            exit 0
          fi
          if [[ ! -f "$CAR" ]]; then
            echo "error: Assets.car missing — AppIcon asset catalog did not compile into the app."
            exit 1
          fi
          if [[ ! -f "$PLIST" ]]; then
            echo "error: Info.plist missing in app bundle."
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$PLIST" &>/dev/null; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" "$PLIST"
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$PLIST"
          fi
    dependencies:
      - target: CareTapWidgetExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxnguyen.caretap
        PRODUCT_NAME: CareTap
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone-only thinning omits iPad icon slots; App Store still validates them for iPad multitasking.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        # Ensures keys are present in the built app Info.plist (merged with CareTap/Info.plist).
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        # iPhone only — runs on iPad in compatibility mode; avoids native iPad multitasking validation.
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        CODE_SIGN_ENTITLEMENTS: CareTap/CareTap.entitlements
      configs:
        Debug:
          ENABLE_DEBUG_DYLIB: NO
  CareTapWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    info:
      path: CareTapWidget/Info.plist
      properties:
        CFBundleDisplayName: TapCare
        CareTapAppGroupIdentifier: group.com.maxnguyen.caretap.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: CareTap/Sources/DesignSystem
      - path: CareTap/Sources/Features/Widgets
      - path: CareTap/Sources/Models
        excludes:
          - AppFlowModels.swift
          - CareTapSyncPayloads.swift
      - path: CareTap/Sources/Services/HomeSnapshotProviding.swift
      - path: CareTap/Sources/Services/CareTapWidgetServiceProtocols.swift
      - path: CareTap/Sources/Infrastructure/PreviewHomeSnapshotService.swift
      - path: CareTap/Sources/Infrastructure/Widgets
      - path: CareTap/Sources/Previews
      - path: CareTapWidget/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxnguyen.caretap.widget
        PRODUCT_NAME: CareTapWidget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: NO
        CODE_SIGN_ENTITLEMENTS: CareTapWidget/CareTapWidget.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APP_EXTENSION
  CareTapTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CareTapTests
        excludes:
          - StudyTests.swift
    dependencies:
      - target: CareTap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxnguyen.caretap.tests
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: CareTapTests
